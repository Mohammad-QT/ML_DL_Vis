<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-NN · ML Visual</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('mlv-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: end; padding: 26px 0 30px; }
  .kicker { font: 600 13px var(--mono); color: var(--muted); }
  h1 { font-size: 68px; line-height: .98; margin: 12px 0 14px; }
  .lede { font-size: 20px; color: var(--muted); max-width: 30em; }
  .fp { padding: 12px; transform: rotate(1.2deg); }
  html[dir="rtl"] .fp { transform: rotate(-1.2deg); }
  .fp canvas { height: 190px; cursor: default; }
  .fp figcaption { font: 500 13px var(--mono); color: var(--muted); padding: 10px 4px 2px; }
  .fp figcaption b { color: var(--ink); font-family: var(--body); font-size: 15px; }

  .progress { display: flex; align-items: center; gap: 10px; font: 500 12px var(--mono); color: var(--muted); }
  .progress .track { width: 120px; height: 6px; border-radius: 9px; background: var(--rule); overflow: hidden; }
  .progress .track i { display: block; height: 100%; width: 28%; background: var(--ok); border-radius: 9px; transition: width .4s; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { display: flex; align-items: center; gap: 9px; border: 1.5px solid var(--rule); background: var(--sheet); color: var(--muted); font: 700 16px var(--body); padding: 8px 18px 8px 9px; border-radius: 13px; cursor: pointer; box-shadow: 0 3px 0 var(--lift); transition: transform .12s; }
  html[dir="rtl"] .tab { padding: 8px 9px 8px 18px; }
  .tab:hover { transform: translateY(-2px); }
  .tab .n { width: 25px; height: 25px; border-radius: 8px; display: grid; place-items: center; font: 600 13px var(--mono); background: var(--paper); }
  .tab.on { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
  .tab.on .n { background: var(--hl); color: #15202b; }
  .tab.done .n { background: var(--ok); color: #fff; }

  .card { display: none; padding: 34px 36px; }
  .card.on { display: block; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .card h2 { font-size: 34px; line-height: 1.1; margin-bottom: 12px; }
  .card h3 { font-size: 21px; margin: 26px 0 10px; }
  .read { max-width: 640px; }
  .read p { margin-bottom: 12px; }
  code { font: 500 .86em var(--mono); background: var(--paper); padding: 1px 6px; border-radius: 5px; }
  .how { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; counter-reset: s; }
  .how li { counter-increment: s; background: var(--paper); border-radius: 14px; padding: 14px; font-size: 15.5px; line-height: 1.45; }
  .how li::before { content: counter(s); display: block; font: 600 13px var(--mono); color: var(--muted); margin-bottom: 6px; }
  .note { margin-top: 22px; border-inline-start: 4px solid var(--hl); padding: 4px 0 4px 16px; }
  html[dir="rtl"] .note { padding: 4px 16px 4px 0; }

  .play { display: grid; grid-template-columns: 1fr 250px; gap: 20px; margin-top: 16px; }
  .frame { border: 1.5px solid var(--rule); border-radius: 16px; padding: 8px; background: var(--sheet); }
  #board { height: 440px; }
  .under { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); padding: 10px 6px 2px; }
  .side { display: flex; flex-direction: column; gap: 12px; }
  .box { background: var(--paper); border-radius: 14px; padding: 12px 14px; }
  .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .scores .num { font: 600 30px/1 var(--mono); }
  .scores small { font: 500 12px var(--mono); color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  #khint { font-size: 13.5px; line-height: 1.4; margin-top: 8px; min-height: 38px; color: var(--muted); }
  .legend { font-size: 13px; color: var(--muted); line-height: 1.4; }

  .q { font: 700 21px/1.35 var(--body); margin-bottom: 8px; }
  .ans { display: block; width: 100%; text-align: start; border: 1.5px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 14px; padding: 14px 18px; margin: 10px 0; font: 700 16.5px var(--body); cursor: pointer; box-shadow: 0 3px 0 var(--lift); transition: transform .12s; }
  .ans:hover { transform: translateY(-2px); }
  .ans.right { border-color: var(--ok); box-shadow: 0 3px 0 var(--ok); }
  .ans.wrong { border-color: var(--bad); box-shadow: 0 3px 0 var(--bad); }
  .ans .tag { float: inline-end; font: 600 12px var(--mono); }
  .ans.right .tag { color: var(--ok); } .ans.wrong .tag { color: var(--bad); }
  .fb { margin-top: 8px; font-size: 16.5px; }

  .codecta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
  .navrow { display: flex; justify-content: space-between; margin-top: 28px; }
  footer { height: 80px; }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; } h1 { font-size: 46px; }
    .play { grid-template-columns: 1fr; } .how { grid-template-columns: 1fr 1fr; }
    .card { padding: 22px; } .progress, .crumbs { display: none; } #board { height: 340px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="../home/"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="1.5" y="1.5" width="25" height="25" rx="7" fill="var(--sheet)" stroke="var(--ink)" stroke-width="1.5"/><path d="M5 20 C10 19 11 9 23 7" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="10" r="2.3" fill="var(--a)"/><circle cx="19" cy="19" r="2.3" fill="var(--b)"/></svg><span data-i18n="brand"></span></a>
    <nav class="crumbs"><a href="../home/" data-i18n="nav_course"></a> / <span data-i18n="crumb_part"></span></nav>
    <div class="spacer"></div>
    <div class="progress"><span data-i18n="progress"></span><span class="track"><i id="pbar"></i></span></div>
    <div class="seg"><button data-lang="en">EN</button><button data-lang="ar">ع</button></div>
    <button class="iconbtn" data-theme-toggle aria-label="Toggle dark mode"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>

  <section class="hero">
    <div>
      <div class="kicker" data-i18n="kicker"></div>
      <h1 class="display" data-i18n="title"></h1>
      <p class="lede" data-i18n="lede"></p>
    </div>
    <figure class="sheet fp">
      <canvas class="board" id="fp"></canvas>
      <figcaption><span data-i18n="fp_cap"></span> <b data-i18n="s_knn"></b></figcaption>
    </figure>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab on" data-step="0"><span class="n">1</span><span data-i18n="s1"></span></button>
    <button class="tab" data-step="1"><span class="n">2</span><span data-i18n="s2"></span></button>
    <button class="tab" data-step="2"><span class="n">3</span><span data-i18n="s3"></span></button>
    <button class="tab" data-step="3"><span class="n">4</span><span data-i18n="s4"></span></button>
  </div>

  <section class="sheet card on">
    <div class="read">
      <h2 class="display" data-i18n="idea_h"></h2>
      <p data-i18n="idea_p"></p>
    </div>
    <h3 class="display" data-i18n="steps_h"></h3>
    <ol class="how"><li data-i18n="step1"></li><li data-i18n="step2"></li><li data-i18n="step3"></li><li data-i18n="step4"></li></ol>
    <div class="note read"><h3 class="display" style="margin-top:0" data-i18n="scaling_h"></h3><p data-i18n="scaling_p"></p></div>
    <div class="navrow"><span></span><button class="btn" data-goto="1"><span data-i18n="s2"></span> <span class="arr">→</span></button></div>
  </section>

  <section class="sheet card">
    <h2 class="display" data-i18n="play_h"></h2>
    <p class="muted read" data-i18n="play_p"></p>
    <div class="play">
      <div class="frame">
        <canvas class="board" id="board"></canvas>
        <div class="under"><span data-i18n="hint_add"></span></div>
      </div>
      <div class="side">
        <div class="box scores">
          <div><small data-i18n="train"></small><div class="num" id="tr">–</div></div>
          <div><small data-i18n="test"></small><div class="num" id="te">–</div></div>
        </div>
        <div class="box"><span class="label"><span data-i18n="p_k"></span> · <b id="kval">5</b></span><input id="k" type="range" min="1" max="25" value="5"><div id="khint"></div></div>
        <div class="box"><span class="label" data-i18n="adding"></span><div class="chips">
          <button class="chip on" data-cls="0"><span class="swatch a"></span><span data-i18n="cls_a"></span></button>
          <button class="chip" data-cls="1"><span class="swatch b"></span><span data-i18n="cls_b"></span></button></div></div>
        <div class="box"><span class="label" data-i18n="data"></span><div class="chips">
          <button class="chip on" data-preset="blobs" data-i18n="d_blobs"></button><button class="chip" data-preset="moons" data-i18n="d_moons"></button>
          <button class="chip" data-preset="circles" data-i18n="d_circles"></button><button class="chip" data-preset="xor" data-i18n="d_xor"></button>
          <button class="chip" id="resplit" data-i18n="resplit"></button><button class="chip" id="clear" data-i18n="clear"></button></div></div>
        <p class="legend"><span class="swatch ring"></span><span data-i18n="legend_test"></span></p>
      </div>
    </div>
    <div class="navrow"><button class="btn ghost" data-goto="0"><span class="arr">←</span> <span data-i18n="s1"></span></button><button class="btn" data-goto="2"><span data-i18n="s3"></span> <span class="arr">→</span></button></div>
  </section>

  <section class="sheet card">
    <div class="read">
      <h2 class="display" data-i18n="quiz_h"></h2>
      <p class="q" data-i18n="q1"></p>
      <button class="ans" data-ans="a1"><span data-i18n="a1"></span><span class="tag"></span></button>
      <button class="ans" data-ans="a2"><span data-i18n="a2"></span><span class="tag"></span></button>
      <button class="ans" data-ans="a3"><span data-i18n="a3"></span><span class="tag"></span></button>
      <p class="fb" id="fb"></p>
    </div>
    <div class="navrow"><button class="btn ghost" data-goto="1"><span class="arr">←</span> <span data-i18n="s2"></span></button><button class="btn" data-goto="3"><span data-i18n="s4"></span> <span class="arr">→</span></button></div>
  </section>

  <section class="sheet card">
    <div class="read">
      <h2 class="display" data-i18n="code_h"></h2>
      <p class="muted" data-i18n="code_p"></p>
<pre><span class="k">from</span> sklearn.neighbors <span class="k">import</span> KNeighborsClassifier
classifier = KNeighborsClassifier(n_neighbors=<span class="n">5</span>)
classifier.fit(X_train, y_train)
y_pred = classifier.predict(X_test)</pre>
      <div class="codecta">
        <a class="btn hl" href="#colab"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 7h10v10M7 17 17 7"/></svg><span data-i18n="colab"></span></a>
        <a class="btn ghost" href="../compare/?a=knn&b=ksvm"><span data-i18n="compare_cta"></span> <span class="arr">→</span></a>
      </div>
    </div>
    <div class="navrow"><button class="btn ghost" data-goto="2"><span class="arr">←</span> <span data-i18n="s3"></span></button><button class="btn"><span data-i18n="next"></span> <span class="arr">→</span></button></div>
  </section>
  <footer class="site-foot" data-i18n="copyright"></footer>
</div>
<div id="toast" data-i18n="colab_toast"></div>
<script src="../shared/engine.js"></script>
<script src="../shared/copy.js"></script>
<script>
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const D = COPY.lesson;
  let ui, k = 5, cls = 0, quizKey = null;

  // fingerprint: a fixed dataset, drawn once
  const fpStore = MLV.Store(); fpStore.points = [];
  const fpBoard = MLV.Board($('#fp'), fpStore, { static: true, cell: 4, dot: 3.6, tint: .24 });
  fpStore.preset('moons', 11); fpStore.points.forEach(p => p.test = false);
  fpBoard.setModel(MLV.fitModel('knn', { k: 5 }, fpStore.points));

  // playground
  const store = MLV.Store({ testFrac: .25 });
  const board = MLV.Board($('#board'), store, { onAdd: (p, e) => store.add(p.x, p.y, e.shiftKey ? 1 - cls : cls) });
  const pct = v => v == null ? '–' : Math.round(v * 100) + '%';
  function refit() {
    const m = MLV.fitModel('knn', { k }, store.train()); board.setModel(m);
    $('#tr').textContent = pct(MLV.score(m, store.train())); $('#te').textContent = pct(MLV.score(m, store.test()));
  }
  store.subscribe(refit);
  const kHint = () => { $('#khint').innerHTML = k <= 3 ? ui.t('k_small') : k >= 15 ? ui.t('k_big') : ''; };
  $('#k').addEventListener('input', e => { k = +e.target.value; $('#kval').textContent = k; kHint(); refit(); });
  $$('[data-cls]').forEach(b => b.addEventListener('click', () => { cls = +b.dataset.cls; $$('[data-cls]').forEach(x => x.classList.toggle('on', x === b)); }));
  $$('[data-preset]').forEach(b => b.addEventListener('click', () => { store.preset(b.dataset.preset); $$('[data-preset]').forEach(x => x.classList.toggle('on', x === b)); }));
  $('#resplit').addEventListener('click', () => store.resplit());
  $('#clear').addEventListener('click', () => { store.clear(); $$('[data-preset]').forEach(x => x.classList.remove('on')); });
  store.preset('blobs', 3);

  // steps
  const tabs = $$('.tab'), cards = $$('.card');
  function go(i) {
    tabs.forEach((t, j) => { t.classList.toggle('on', j === i); if (j < i) t.classList.add('done'); });
    cards.forEach((c, j) => { c.classList.toggle('on', j === i); c.classList.remove('lit'); });
    requestAnimationFrame(() => requestAnimationFrame(() => cards[i].classList.add('lit')));
    $('#pbar').style.width = (28 + i * 4) + '%';
  }
  tabs.forEach(t => t.addEventListener('click', () => go(+t.dataset.step)));
  $$('[data-goto]').forEach(b => b.addEventListener('click', () => go(+b.dataset.goto)));

  // quiz
  $$('.ans').forEach(b => b.addEventListener('click', () => {
    const ok = b.dataset.ans === 'a1';
    $$('.ans').forEach(x => { x.classList.remove('right', 'wrong'); x.querySelector('.tag').textContent = ''; });
    b.classList.add(ok ? 'right' : 'wrong'); b.querySelector('.tag').textContent = ok ? '✓' : '✗';
    quizKey = ok ? 'right' : 'wrong'; $('#fb').innerHTML = ui.t(quizKey);
    $('#fb').classList.remove('lit'); requestAnimationFrame(() => requestAnimationFrame(() => $('#fb').classList.add('lit')));
  }));

  ui = MLV.initChrome(D, () => { if (ui) { kHint(); if (quizKey) $('#fb').innerHTML = ui.t(quizKey); } });
  kHint(); go(0);
</script>
</body>
</html>
