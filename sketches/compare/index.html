<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare · ML Visual</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('mlv-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .head { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: end; padding: 26px 0 24px; }
  h1 { font-size: 58px; line-height: 1; }
  .lede { color: var(--muted); font-size: 18px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 14px 18px; margin-bottom: 18px; }
  .toolbar .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .toolbar .label { margin: 0 6px 0 0; }
  html[dir="rtl"] .toolbar .label { margin: 0 0 0 6px; }
  .legend { font-size: 13.5px; color: var(--muted); margin-inline-start: auto; }
  .duel { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: start; }
  .side { padding: 14px; }
  .side header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .tagAB { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 600 15px var(--mono); background: var(--ink); color: var(--sheet); flex: none; }
  select { flex: 1; appearance: none; border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); font: 750 19px var(--display); letter-spacing: -.01em; padding: 7px 34px 7px 12px; border-radius: 11px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
  html[dir="rtl"] select { padding: 7px 12px 7px 34px; background-position: 18px 55%, 13px 55%; font-family: var(--display); }
  .param { min-height: 58px; padding: 2px 4px 8px; }
  .param .label b { color: var(--ink); }
  .param p { font-size: 14px; color: var(--muted); padding-top: 8px; }
  .shape { font: 500 13px var(--mono); color: var(--muted); padding: 0 4px 8px; }
  .side canvas { height: 400px; }
  .scores { display: flex; gap: 22px; padding: 12px 6px 2px; align-items: baseline; }
  .scores div { display: flex; gap: 8px; align-items: baseline; }
  .scores small { font: 500 12px var(--mono); color: var(--muted); text-transform: uppercase; }
  .scores .num { font: 600 28px/1 var(--mono); }
  .scores .bar { flex: 1; height: 8px; background: var(--paper); border-radius: 9px; overflow: hidden; align-self: center; }
  .scores .bar i { display: block; height: 100%; background: var(--ink); border-radius: 9px; transition: width .35s; width: 0; }
  .side.lead { border-color: var(--ink); }
  .mid { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 220px; }
  .vs { font: 750 22px var(--display); color: var(--muted); }
  .verdict { margin-top: 18px; padding: 18px 22px; font-size: 18px; display: flex; gap: 14px; align-items: flex-start; }
  .verdict .mark { width: 10px; align-self: stretch; border-radius: 9px; background: var(--hl); flex: none; }
  .verdict p + p { margin-top: 6px; color: var(--muted); font-size: 16px; }
  footer { height: 80px; }
  @media (max-width: 900px) { .head { grid-template-columns: 1fr; gap: 10px; } h1 { font-size: 42px; } .duel { grid-template-columns: 1fr; } .mid { flex-direction: row; padding: 0; justify-content: center; } .side canvas { height: 320px; } .navlinks { display: none; } .legend { margin-inline-start: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="../home/"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="1.5" y="1.5" width="25" height="25" rx="7" fill="var(--sheet)" stroke="var(--ink)" stroke-width="1.5"/><path d="M5 20 C10 19 11 9 23 7" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="10" r="2.3" fill="var(--a)"/><circle cx="19" cy="19" r="2.3" fill="var(--b)"/></svg><span data-i18n="brand"></span></a>
    <nav class="navlinks"><a href="../home/#route" data-i18n="nav_course"></a><a href="../home/#pick" data-i18n="nav_pick"></a><a href="./" class="cur" data-i18n="nav_compare"></a></nav>
    <div class="spacer"></div>
    <div class="seg"><button data-lang="en">EN</button><button data-lang="ar">ع</button></div>
    <button class="iconbtn" data-theme-toggle aria-label="Toggle dark mode"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>

  <section class="head" id="head">
    <h1 class="display" data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
  </section>

  <div class="sheet toolbar">
    <div class="grp"><span class="label" data-i18n="data"></span>
      <button class="chip on" data-preset="moons" data-i18n="d_moons"></button><button class="chip" data-preset="blobs" data-i18n="d_blobs"></button>
      <button class="chip" data-preset="circles" data-i18n="d_circles"></button><button class="chip" data-preset="xor" data-i18n="d_xor"></button>
      <button class="chip" id="resplit" data-i18n="resplit"></button><button class="chip" id="clear" data-i18n="clear"></button></div>
    <div class="grp"><span class="label" data-i18n="adding"></span>
      <button class="chip on" data-cls="0"><span class="swatch a"></span><span data-i18n="cls_a"></span></button>
      <button class="chip" data-cls="1"><span class="swatch b"></span><span data-i18n="cls_b"></span></button></div>
    <span class="legend"><span class="swatch ring"></span><span data-i18n="legend_test"></span></span>
  </div>

  <div class="duel">
    <section class="sheet side" data-side="a">
      <header><span class="tagAB">A</span><select aria-label="Algorithm A"></select></header>
      <div class="shape"></div>
      <div class="param"></div>
      <canvas class="board"></canvas>
      <div class="scores"><div><small data-i18n="train"></small><span class="num tr">–</span></div><div><small data-i18n="test"></small><span class="num te">–</span></div><span class="bar"><i></i></span></div>
    </section>
    <div class="mid"><span class="vs">vs</span><button class="iconbtn" id="swap" aria-label="Swap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h13l-4-4M17 17H4l4 4"/></svg></button></div>
    <section class="sheet side" data-side="b">
      <header><span class="tagAB">B</span><select aria-label="Algorithm B"></select></header>
      <div class="shape"></div>
      <div class="param"></div>
      <canvas class="board"></canvas>
      <div class="scores"><div><small data-i18n="train"></small><span class="num tr">–</span></div><div><small data-i18n="test"></small><span class="num te">–</span></div><span class="bar"><i></i></span></div>
    </section>
  </div>

  <div class="sheet verdict"><span class="mark"></span><div id="verdict"></div></div>
  <footer class="site-foot" data-i18n="copyright"></footer>
</div>
<div id="toast" data-i18n="colab_toast"></div>
<script src="../shared/engine.js"></script>
<script src="../shared/copy.js"></script>
<script>
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const ORDER = ['knn', 'logistic', 'svm', 'ksvm', 'nb', 'tree', 'forest'];
  const q = new URLSearchParams(location.search);
  const pickOr = (v, d) => ORDER.includes(v) ? v : d;
  let ui, cls = 0;
  const store = MLV.Store({ testFrac: .25 });
  const sides = { a: { name: pickOr(q.get('a'), 'knn') }, b: { name: pickOr(q.get('b'), 'tree') } };

  Object.entries(sides).forEach(([key, s]) => {
    s.el = $(`.side[data-side="${key}"]`);
    s.params = MLV.defaults(s.name);
    const other = () => sides[key === 'a' ? 'b' : 'a'];
    s.board = MLV.Board(s.el.querySelector('canvas'), store, {
      onAdd: (p, e) => store.add(p.x, p.y, e.shiftKey ? 1 - cls : cls),
      onHover: g => other().board.setGhost(g),
    });
    s.el.querySelector('select').addEventListener('change', e => { s.name = e.target.value; s.params = MLV.defaults(s.name); buildParam(s); refit(); syncUrl(); });
  });

  const fmt = (spec, v) => spec.log ? (+Math.pow(10, v).toPrecision(2)).toString() : v;
  function buildParam(s) {
    const box = s.el.querySelector('.param'), specs = Object.entries(MLV.MODELS[s.name].params);
    s.el.querySelector('.shape').textContent = '→ ' + ui.t('s_' + s.name);
    if (!specs.length) { box.innerHTML = `<p>${ui.t('p_none')}</p>`; return; }
    const [k, spec] = specs[0];
    box.innerHTML = `<span class="label">${ui.t('p_' + k)} · <b>${fmt(spec, s.params[k])}</b></span><input type="range" min="${spec.min}" max="${spec.max}" step="${spec.step}" value="${s.params[k]}">`;
    box.querySelector('input').addEventListener('input', e => { s.params[k] = +e.target.value; box.querySelector('b').textContent = fmt(spec, s.params[k]); refit(); });
  }
  function fillSelects() {
    Object.values(sides).forEach(s => {
      const sel = s.el.querySelector('select');
      sel.innerHTML = ORDER.map(n => `<option value="${n}">${ui.t('m_' + n)}</option>`).join(''); sel.value = s.name;
      buildParam(s);
    });
  }
  const pct = v => v == null ? '–' : Math.round(v * 100) + '%';
  function refit() {
    const tr = store.train(), te = store.test();
    Object.values(sides).forEach(s => {
      s.model = MLV.fitModel(s.name, s.params, tr); s.board.setModel(s.model);
      s.tr = MLV.score(s.model, tr); s.te = MLV.score(s.model, te);
      s.el.querySelector('.tr').textContent = pct(s.tr); s.el.querySelector('.te').textContent = pct(s.te);
      s.el.querySelector('.bar i').style.width = (s.te ?? 0) * 100 + '%';
    });
    verdict();
  }
  function verdict() {
    const A = sides.a, B = sides.b, n = store.test().length, out = [];
    $$('.side').forEach(e => e.classList.remove('lead'));
    if (n < 4 || A.te == null) out.push(ui.t('v_more'));
    else {
      const d = Math.round((A.te - B.te) * n);
      if (d === 0) out.push(ui.t('v_tie'));
      else { const w = d > 0 ? A : B; w.el.classList.add('lead'); out.push(ui.t('v_win').replace('{m}', `<b>${ui.t('m_' + w.name)}</b>`).replace('{d}', Math.abs(d)).replace('{n}', n)); }
      [A, B].forEach(s => { if (s.tr - s.te > .12) out.push(ui.t('v_over').replace('{m}', ui.t('m_' + s.name)).replace('{tr}', Math.round(s.tr * 100)).replace('{te}', Math.round(s.te * 100))); });
    }
    $('#verdict').innerHTML = out.map(t => `<p>${t}</p>`).join('');
  }
  function syncUrl() { history.replaceState(null, '', `?a=${sides.a.name}&b=${sides.b.name}`); }

  store.subscribe(refit);
  $$('[data-cls]').forEach(b => b.addEventListener('click', () => { cls = +b.dataset.cls; $$('[data-cls]').forEach(x => x.classList.toggle('on', x === b)); }));
  $$('[data-preset]').forEach(b => b.addEventListener('click', () => { store.preset(b.dataset.preset); $$('[data-preset]').forEach(x => x.classList.toggle('on', x === b)); }));
  $('#resplit').addEventListener('click', () => store.resplit());
  $('#clear').addEventListener('click', () => { store.clear(); $$('[data-preset]').forEach(x => x.classList.remove('on')); });
  $('#swap').addEventListener('click', () => {
    [sides.a.name, sides.b.name] = [sides.b.name, sides.a.name]; [sides.a.params, sides.b.params] = [sides.b.params, sides.a.params];
    fillSelects(); refit(); syncUrl();
  });

  ui = MLV.initChrome(COPY.compare, () => { if (ui) { fillSelects(); verdict(); } });
  fillSelects(); store.preset('moons', 5);
  requestAnimationFrame(() => requestAnimationFrame(() => $('#head').classList.add('lit')));
</script>
</body>
</html>
