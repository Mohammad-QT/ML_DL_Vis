<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML Visual</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('mlv-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .hero { display: grid; grid-template-columns: 1fr 1.25fr; gap: 44px; align-items: center; padding: 34px 0 70px; }
  h1 { font-size: 66px; line-height: .98; margin-bottom: 18px; }
  .lede { font-size: 19.5px; color: var(--muted); margin-bottom: 26px; }
  .ctas { display: flex; flex-wrap: wrap; gap: 12px; }
  .stage { padding: 10px; }
  #hero { height: 380px; cursor: default; }
  .now { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 12px 6px 4px; }
  .now .label { margin: 0; }
  .now b { font: 750 20px var(--display); letter-spacing: -.01em; }
  .now span.shape { color: var(--muted); font-size: 15px; }
  .algos { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 4px 4px; }
  .algos .chip { font-size: 13px; padding: 3px 10px; }

  section.block { padding: 40px 0; }
  .block > h2 { font-size: 40px; line-height: 1.05; }
  .block > p.sub { color: var(--muted); font-size: 18px; margin: 8px 0 26px; max-width: 36em; }

  /* the route: a plotted line connecting the parts */
  .route { list-style: none; position: relative; }
  .route::before { content: ""; position: absolute; inset-inline-start: 27px; top: 30px; bottom: 30px; width: 2px; background: repeating-linear-gradient(var(--ink) 0 8px, transparent 8px 14px); opacity: .35; }
  .stop { position: relative; display: grid; grid-template-columns: 56px 1fr; gap: 18px; margin-bottom: 16px; }
  .stop .pt { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font: 600 20px var(--mono); background: var(--sheet); border: 1.5px solid var(--ink); box-shadow: 0 4px 0 var(--lift); z-index: 1; }
  .stop.first .pt { background: var(--hl); color: #15202b; border-color: #d9b928; }
  .stop .body { padding: 18px 22px; }
  .stop h3 { font-size: 24px; line-height: 1.15; display: flex; justify-content: space-between; gap: 10px; }
  .stop h3 small { font: 500 13px var(--mono); color: var(--muted); white-space: nowrap; }
  .stop p { color: var(--muted); margin-top: 4px; }
  .stop.later .pt { border-style: dashed; color: var(--muted); background: transparent; box-shadow: none; }
  .stop.later .body { border-style: dashed; background: transparent; box-shadow: none; }
  .minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; margin-top: 14px; }
  .mini { text-decoration: none; border: 1.5px solid var(--rule); border-radius: 12px; padding: 6px; background: var(--paper); transition: border-color .12s, transform .12s; }
  .mini:hover { border-color: var(--ink); transform: translateY(-2px); }
  .mini canvas, .mini svg { width: 100%; height: 62px; display: block; border-radius: 7px; background: var(--sheet); cursor: pointer; }
  .mini span { display: block; font-size: 13px; font-weight: 700; padding: 6px 2px 1px; line-height: 1.25; }

  /* picker */
  .picker { padding: 28px 30px; }
  .qs { display: grid; gap: 22px; }
  .qblock { transition: opacity .2s; }
  .qblock.off { display: none; }
  .qblock h3 { font-size: 21px; margin-bottom: 10px; }
  .opts { display: flex; flex-wrap: wrap; gap: 10px; }
  .opt { border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 14px; padding: 12px 16px; text-align: start; font: 700 16px var(--body); cursor: pointer; transition: border-color .12s, transform .12s; }
  .opt small { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }
  .opt:hover { border-color: var(--muted); transform: translateY(-1px); }
  .opt.on { border-color: var(--ink); background: var(--ink); color: var(--sheet); }
  .opt.on small { color: inherit; opacity: .75; }
  .result { margin-top: 26px; padding-top: 22px; border-top: 1.5px dashed var(--rule); }
  .result.off { display: none; }
  .result h3 { font-size: 24px; margin-bottom: 12px; }
  .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .pick { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; background: var(--paper); border-radius: 14px; padding: 10px; }
  .pick canvas { width: 96px; height: 70px; border-radius: 8px; cursor: default; }
  .pick b { display: block; font-size: 16px; } .pick small { color: var(--muted); font-size: 13.5px; line-height: 1.35; display: block; }
  .pick .rank { font: 600 12px var(--mono); color: var(--muted); }
  .result p.plain { max-width: 40em; margin-bottom: 14px; }
  .resrow { display: flex; flex-wrap: wrap; gap: 10px; }
  footer { padding: 50px 0 70px; color: var(--muted); font-size: 14px; }

  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } h1 { font-size: 46px; } #hero { height: 300px; } .navlinks { display: none; } .picker { padding: 20px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="./"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="1.5" y="1.5" width="25" height="25" rx="7" fill="var(--sheet)" stroke="var(--ink)" stroke-width="1.5"/><path d="M5 20 C10 19 11 9 23 7" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="10" r="2.3" fill="var(--a)"/><circle cx="19" cy="19" r="2.3" fill="var(--b)"/></svg><span data-i18n="brand"></span></a>
    <nav class="navlinks"><a href="#route" class="cur" data-i18n="nav_course"></a><a href="#pick" data-i18n="nav_pick"></a><a href="../compare/" data-i18n="nav_compare"></a></nav>
    <div class="spacer"></div>
    <div class="seg"><button data-lang="en">EN</button><button data-lang="ar">ع</button></div>
    <button class="iconbtn" data-theme-toggle aria-label="Toggle dark mode"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>

  <section class="hero" id="top">
    <div>
      <h1 class="display" data-i18n="h1"></h1>
      <p class="lede" data-i18n="lede"></p>
      <div class="ctas">
        <a class="btn" href="../006-lesson/"><span data-i18n="start"></span> <span class="arr">→</span></a>
        <a class="btn ghost" href="#pick" data-i18n="pick"></a>
      </div>
    </div>
    <figure class="sheet stage" id="stage">
      <canvas class="board" id="hero"></canvas>
      <figcaption>
        <div class="now"><span class="label" data-i18n="drawing"></span><b id="nowName"></b><span class="shape" id="nowShape"></span></div>
        <div class="algos" id="algos"></div>
      </figcaption>
    </figure>
  </section>

  <section class="block" id="route">
    <h2 class="display" data-i18n="route_h"></h2>
    <p class="sub" data-i18n="route_p"></p>
    <ol class="route">
      <li class="stop first"><div class="pt">0</div><div class="sheet body"><h3 class="display"><span data-i18n="p0"></span></h3><p data-i18n="p0_d"></p></div></li>
      <li class="stop"><div class="pt">1</div><div class="sheet body"><h3 class="display"><span data-i18n="p1"></span><small>4 <span data-i18n="lessons"></span></small></h3><p data-i18n="p1_d"></p></div></li>
      <li class="stop"><div class="pt">2</div><div class="sheet body"><h3 class="display"><span data-i18n="p2"></span><small>6 <span data-i18n="lessons"></span></small></h3><p data-i18n="p2_d"></p><div class="minis" id="regMinis"></div></div></li>
      <li class="stop"><div class="pt">3</div><div class="sheet body"><h3 class="display"><span data-i18n="p3"></span><small>7 <span data-i18n="lessons"></span></small></h3><p data-i18n="p3_d"></p><div class="minis" id="clsMinis"></div></div></li>
      <li class="stop later"><div class="pt">4–9</div><div class="sheet body"><h3 class="display"><span data-i18n="later"></span></h3><p data-i18n="later_d"></p></div></li>
      <li class="stop"><div class="pt">10</div><div class="sheet body"><h3 class="display"><span data-i18n="p10"></span><small>3 <span data-i18n="lessons"></span></small></h3><p data-i18n="p10_d"></p></div></li>
    </ol>
  </section>

  <section class="block" id="pick">
    <h2 class="display" data-i18n="pick_h"></h2>
    <p class="sub" data-i18n="pick_p"></p>
    <div class="sheet picker">
      <div class="qs">
        <div class="qblock" data-q="1"><h3 class="display" data-i18n="q1"></h3><div class="opts">
          <button class="opt" data-v="num"><span data-i18n="q1a"></span><small data-i18n="q1a_d"></small></button>
          <button class="opt" data-v="cat"><span data-i18n="q1b"></span><small data-i18n="q1b_d"></small></button>
          <button class="opt" data-v="grp"><span data-i18n="q1c"></span><small data-i18n="q1c_d"></small></button></div></div>
        <div class="qblock off" data-q="2"><h3 class="display" data-i18n="q2"></h3><div class="opts">
          <button class="opt" data-v="yes" data-i18n="q2a"></button><button class="opt" data-v="no" data-i18n="q2b"></button></div></div>
        <div class="qblock off" data-q="3"><h3 class="display" data-i18n="q3"></h3><div class="opts">
          <button class="opt" data-v="clean" data-i18n="q3a"></button><button class="opt" data-v="curvy" data-i18n="q3b"></button><button class="opt" data-v="unsure" data-i18n="q3c"></button></div></div>
      </div>
      <div class="result off" id="result"></div>
    </div>
  </section>
  <footer class="site-foot" data-i18n="copyright"></footer>
</div>
<div id="toast" data-i18n="colab_toast"></div>
<script src="../shared/engine.js"></script>
<script src="../shared/copy.js"></script>
<script>
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const ORDER = ['knn', 'logistic', 'svm', 'ksvm', 'nb', 'tree', 'forest'];
  let ui;

  // one shared dataset for every drawing on the page, so the shapes are comparable
  const data = MLV.Store(); data.preset('moons', 11); data.points.forEach(p => p.test = false);
  const fitted = {}; ORDER.forEach(n => fitted[n] = MLV.fitModel(n, {}, data.points));

  // hero: the same points, redrawn by each algorithm in turn
  const hero = MLV.Board($('#hero'), data, { static: true, cell: 5, dot: 4.5, tint: .24 });
  let cur = 0, timer = null;
  ORDER.forEach((n, i) => { const b = document.createElement('button'); b.className = 'chip'; b.dataset.m = n; b.dataset.i18n = 'm_' + n; b.addEventListener('click', () => { stop(); show(i); }); $('#algos').append(b); });
  function show(i, animate = true) {
    cur = i; const n = ORDER[i];
    hero.setModel(fitted[n], animate);
    $('#nowName').textContent = ui.t('m_' + n); $('#nowShape').textContent = ui.t('s_' + n);
    $$('#algos .chip').forEach(c => c.classList.toggle('on', c.dataset.m === n));
  }
  function stop() { clearInterval(timer); timer = null; }
  function play() { if (!matchMedia('(prefers-reduced-motion: reduce)').matches) timer = setInterval(() => show((cur + 1) % ORDER.length), 3200); }
  $('#stage').addEventListener('mouseenter', stop);
  $('#stage').addEventListener('mouseleave', () => { if (!timer) play(); });

  // route minis
  ORDER.forEach(n => {
    const a = document.createElement('a'); a.className = 'mini'; a.href = n === 'knn' ? '../006-lesson/' : '#';
    a.innerHTML = `<canvas class="board"></canvas><span data-i18n="m_${n}"></span>`; $('#clsMinis').append(a);
    MLV.Board(a.querySelector('canvas'), data, { static: true, cell: 3, dot: 1.8, tint: .3 }).setModel(fitted[n]);
  });
  const dots = '<g fill="var(--a)">' + [[8,40],[16,35],[24,35],[32,28],[40,27],[48,20],[56,18],[64,11],[72,9]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.2"/>`).join('') + '</g>';
  const REG = {
    r_lin: '<path d="M4 41 L76 7"/>',
    r_mlin: '<path d="M4 41 L76 7"/><path d="M4 33 L76 1" opacity=".35" stroke-dasharray="3 3"/>',
    r_poly: '<path d="M4 41 C 34 40, 46 22, 76 5"/>',
    r_svr: '<path d="M4 41 L76 7"/><path d="M4 35 L76 1 M4 47 L76 13" opacity=".45" stroke-dasharray="3 3"/>',
    r_tree: '<path d="M4 38 H22 V32 H40 V25 H56 V14 H76"/>',
    r_forest: '<path d="M4 39 H12 V36 H22 V33 H30 V29 H40 V26 H48 V21 H56 V17 H66 V11 H76"/>',
  };
  Object.entries(REG).forEach(([k, path]) => {
    const a = document.createElement('a'); a.className = 'mini'; a.href = '#';
    a.innerHTML = `<svg viewBox="0 0 80 48" preserveAspectRatio="none"><g fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round">${path}</g>${dots}</svg><span data-i18n="${k}"></span>`;
    $('#regMinis').append(a);
  });

  // picker
  const ans = {};
  function recommend() {
    if (ans[1] === 'num') return { plain: 'res_reg' };
    if (ans[1] === 'grp') return { plain: 'res_clu' };
    if (!ans[2] || !ans[3]) return null;
    const table = {
      'yes-clean': ['logistic', 'tree'], 'yes-curvy': ['tree', 'knn'], 'yes-unsure': ['tree', 'logistic', 'knn'],
      'no-clean': ['svm', 'logistic'], 'no-curvy': ['ksvm', 'forest', 'knn'], 'no-unsure': ['forest', 'ksvm', 'knn'],
    };
    return { list: table[ans[2] + '-' + ans[3]] };
  }
  function renderResult() {
    const r = recommend(), el = $('#result');
    if (!r) { el.classList.add('off'); return; }
    el.classList.remove('off');
    if (r.plain) { el.innerHTML = `<p class="plain">${ui.t(r.plain)}</p><div class="resrow"><button class="btn ghost" id="restart">${ui.t('restart')}</button></div>`; }
    else {
      el.innerHTML = `<h3 class="display">${ui.t('res_h')}</h3><div class="picks">${r.list.map((n, i) => `<div class="pick"><canvas class="board" data-m="${n}"></canvas><div><span class="rank">#${i + 1}</span><b>${ui.t('m_' + n)}</b><small>${ui.t('why_' + n)}</small></div></div>`).join('')}</div>
        <div class="resrow"><a class="btn" href="../compare/?a=${r.list[0]}&b=${r.list[1]}">${ui.t('res_compare')} <span class="arr">→</span></a><button class="btn ghost" id="restart">${ui.t('restart')}</button></div>`;
      el.querySelectorAll('canvas').forEach(c => MLV.Board(c, data, { static: true, cell: 3, dot: 1.8, tint: .3 }).setModel(fitted[c.dataset.m]));
    }
    $('#restart').addEventListener('click', () => { Object.keys(ans).forEach(k => delete ans[k]); $$('.opt').forEach(o => o.classList.remove('on')); $$('.qblock').forEach(q => q.classList.toggle('off', q.dataset.q !== '1')); renderResult(); });
  }
  $$('.qblock').forEach(q => q.querySelectorAll('.opt').forEach(o => o.addEventListener('click', () => {
    const n = +q.dataset.q; ans[n] = o.dataset.v;
    q.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === o));
    if (n === 1) { const cat = ans[1] === 'cat'; $$('.qblock').forEach(b => { if (+b.dataset.q > 1) b.classList.toggle('off', !cat || (+b.dataset.q === 3 && !ans[2])); }); if (!cat) { delete ans[2]; delete ans[3]; } }
    if (n === 2) $('.qblock[data-q="3"]').classList.remove('off');
    renderResult();
  })));

  ui = MLV.initChrome(COPY.home, () => { if (ui) { show(cur, false); renderResult(); } });
  show(0, false); play();
  requestAnimationFrame(() => requestAnimationFrame(() => $('#top').classList.add('lit')));
</script>
</body>
</html>
