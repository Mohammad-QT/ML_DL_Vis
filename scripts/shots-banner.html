<style>
  .banner {
    display: grid; grid-template-columns: 548px 508px; gap: 80px; align-items: center;
    width: 1280px; height: 400px; padding: 40px 72px;
  }
  .banner-brand {
    display: flex; align-items: center; gap: 14px; margin-bottom: 22px;
    font: 750 30px/1 var(--display); letter-spacing: -.02em;
  }
  .banner-brand svg { width: 44px; height: 44px; }
  .banner h1 { font: 750 56px/1.12 var(--display); letter-spacing: -.035em; font-stretch: 92%; }
  .banner mark { padding: 0; background: linear-gradient(transparent 65%, var(--hl-mark) 65%); }
  .banner p { max-width: 470px; margin-top: 40px; font: 20px/1.3 var(--body); color: var(--muted); }
  .banner-board { display: block; width: 508px; height: 320px; border: 1px solid var(--rule); border-radius: 25px; }
  :root[data-theme="light"] .banner-board { box-shadow: 0 20px 45px #15202b42; }
</style>
<main class="banner">
  <div>
    <div class="banner-brand">AI Visual</div>
    <h1>Every algorithm<br>draws a <mark>different line</mark>.</h1>
    <p>A free, bilingual course where models draw their decisions as you change the data.</p>
  </div>
  <img class="banner-board" alt="Live decision boundary between two groups of points">
</main>
